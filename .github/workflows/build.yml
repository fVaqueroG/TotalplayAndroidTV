name: Build and publish Totalplay TV Guide prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: totalplay-tv-guide-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The setup-android default "tools" package no longer exists in the SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK for Obtainium
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Totalplay-TV-Guide-v0.1.${GITHUB_RUN_NUMBER}-prototype.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: totalplay-tv-guide-prototype-apk
          path: Totalplay-TV-Guide-*.apk
      - name: Publish APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}-prototype"
          gh release create "$VERSION" "Totalplay-TV-Guide-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Totalplay TV Guide $VERSION" \
            --notes "Android TV companion UI prototype only. Opens the official Totalplay app for authorized viewing; it does not play channels inside the guide. This APK is signed with the CI runner's temporary debug key. A future build can have a different signature and may require uninstalling this prototype before reinstalling. Do not remove the official Totalplay app."
