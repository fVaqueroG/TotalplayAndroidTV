plugins { id 'com.android.application' }

// Each CI build gets a distinct Android versionCode for Obtainium update detection.
def ciBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def releaseStore = System.getenv('TV_SIGNING_STORE_FILE')
def releasePassword = System.getenv('TV_SIGNING_PASSWORD')

android {
    namespace 'com.fv.totalplaytv.ui'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fv.totalplaytv.ui'
        minSdk 26
        targetSdk 33
        versionCode 1000 + ciBuildNumber
        versionName "0.1.${ciBuildNumber}-prototype"
    }
    signingConfigs {
        if (releaseStore && releasePassword) {
            obtainium {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias 'totalplayguide'
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore && releasePassword) {
                signingConfig signingConfigs.obtainium
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
