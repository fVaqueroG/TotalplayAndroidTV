plugins { id 'com.android.application' }

// Every GitHub Actions build needs a newer Android versionCode so Obtainium
// can recognize it as an update. Local builds keep the prototype baseline.
def ciBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.fv.totalplaytv.ui'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fv.totalplaytv.ui'
        minSdk 26
        targetSdk 32
        versionCode 1000 + ciBuildNumber
        versionName "0.1.${ciBuildNumber}-prototype"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
